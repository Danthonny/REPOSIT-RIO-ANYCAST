# O site da Boske é a raiz. /boske/ era o endereço antigo — redireciona
# em definitivo para não quebrar link que já tenha sido compartilhado.
[[redirects]]
  from = "/boske/*"
  to = "/"
  status = 301
  force = true

[build]
  # Site 100% estático — nada pra compilar.
  publish = "."
  command = "echo 'site estatico — sem build'"

# Cache dos assets, mas HTML sempre fresco (evita cliente ver versão velha).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
